<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>眼明手快 遊戲規則海報</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
@page{size:420mm 297mm;margin:0}
:root{--navy:#1F2A5C;--navy2:#2C3A75;--gold:#FFC93C;--red:#FF6B5B;--teal:#17A99B;--orange:#F5A623;--cream:#FFF7E8;--gray:#5B6275}
*{box-sizing:border-box;margin:0;padding:0}
i{font-style:normal}
html,body{width:1587px;height:1123px;background:var(--cream)}
body{font-family:'Noto Sans TC',sans-serif;color:var(--navy);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
header{background:var(--navy);border-bottom:14px solid var(--gold);padding:20px 44px 22px;display:flex;align-items:center;justify-content:space-between}
.title{display:flex;align-items:baseline;gap:26px}
.title h1{color:#fff;font-weight:900;font-size:104px;line-height:1.05;letter-spacing:4px}
.title h2{color:var(--gold);font-weight:900;font-size:46px}
.title b{color:#fff;background:var(--red);border-radius:12px;padding:2px 16px;font-size:34px;font-weight:900;position:relative;top:-4px}
.hosts{display:flex;flex-direction:column;gap:6px;background:var(--navy2);border:3px solid var(--gold);border-radius:18px;padding:12px 24px}
.host{display:flex;align-items:center;gap:12px;color:#fff;font-weight:700;font-size:26px}
.badge{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:900}
.host .badge{width:36px;height:36px;font-size:21px}
.hosts .lbl{color:var(--gold);font-size:20px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding:28px 44px 0;position:relative}
.step{background:#fff;border:4px solid var(--navy);border-radius:24px;padding:14px 12px 20px;text-align:center;position:relative}
.step .tag{color:#fff;font-weight:900;font-size:30px;border-radius:50%;width:52px;height:52px;display:grid;place-items:center;position:absolute;left:14px;top:14px}
.step svg{display:block;height:270px;width:auto;margin:20px auto 0}
.step h4{font-weight:900;font-size:42px;margin-top:6px;white-space:nowrap}
.step p{color:var(--gray);font-weight:700;font-size:28px;margin-top:6px;white-space:nowrap}
.arrow{position:absolute;top:calc(50% + 13px);width:36px;height:36px;margin-top:-18px;border-radius:50%;background:var(--gold);border:3px solid var(--navy);z-index:2;display:grid;place-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr 1.55fr;gap:24px;padding:26px 44px 0}
.card{background:#fff;border:5px solid;border-radius:24px;overflow:hidden;text-align:center}
.card .hd{color:#fff;font-weight:900;font-size:38px;padding:12px 12px;display:flex;align-items:center;justify-content:center;gap:12px}
.card .hd .badge{width:46px;height:46px;background:#fff;font-size:28px}
.card .bd{font-weight:900;font-size:50px;padding:34px 10px}
.pass{background:var(--gold);border:5px solid var(--navy);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.1}
.pass .s{font-size:40px}
.pass .s em{font-style:normal;font-size:68px;color:var(--red)}
.pass .b{font-size:80px;margin-top:4px}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:26px 44px 0}
.note{background:var(--navy);color:#fff;border-radius:22px;padding:16px 24px;display:flex;gap:16px;align-items:center;font-weight:700;font-size:32px;white-space:nowrap}
.note span{border-radius:22px;padding:2px 18px;font-weight:900;font-size:28px;color:var(--navy)}
</style></head>
