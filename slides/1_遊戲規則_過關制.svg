<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FFF7E8"/><circle cx="1700" cy="60" r="9" fill="#FFC93C" opacity=".8"/><circle cx="1820" cy="120" r="9" fill="#FF6B5B" opacity=".8"/><circle cx="1640" cy="150" r="9" fill="#17A99B" opacity=".8"/><circle cx="40" cy="1050" r="9" fill="#FFC93C" opacity=".8"/><circle cx="1880" cy="1040" r="9" fill="#FF6B5B" opacity=".8"/><circle cx="1895" cy="990" r="9" fill="#17A99B" opacity=".8"/><rect width="1920" height="215" fill="#1F2A5C"/><path d="M0,215 L1920,215 L1920,229 L0,229Z" fill="#FFC93C"/><text x="80" y="72" font-size="30" fill="#FFC93C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" letter-spacing="2">ACTIVITY PART II ｜ 遊樂園闖關遊戲</text><text x="80" y="178" font-size="96" fill="#fff" font-weight="900" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >眼明手快</text><text x="500" y="172" font-size="48" fill="#FFC93C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >碰碰車情報任務</text><rect x="1230" y="48" width="620" height="128" rx="22" fill="#2C3A75" stroke="#FFC93C" stroke-width="3"/><text x="1262" y="98" font-size="28" fill="#FFC93C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >關主</text><circle cx="1280" cy="140" r="18" fill="#FF6B5B"/><text x="1280" y="149" font-size="24" fill="#fff" font-weight="800" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >A</text><line x1="1306" y1="156" x2="1438" y2="156" stroke="#9AA6D6" stroke-width="2"/><circle cx="1476" cy="140" r="18" fill="#17A99B"/><text x="1476" y="149" font-size="24" fill="#fff" font-weight="800" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >B</text><line x1="1502" y1="156" x2="1634" y2="156" stroke="#9AA6D6" stroke-width="2"/><circle cx="1672" cy="140" r="18" fill="#F5A623"/><text x="1672" y="149" font-size="24" fill="#fff" font-weight="800" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >C</text><line x1="1698" y1="156" x2="1830" y2="156" stroke="#9AA6D6" stroke-width="2"/><rect x="80" y="262" width="640" height="74" rx="37" fill="#fff" stroke="#1F2A5C" stroke-width="3"/><rect x="90" y="272" width="96" height="54" rx="27" fill="#FF6B5B"/><text x="138" y="309" font-size="26" fill="#fff" font-weight="800" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >地點</text><text x="206" y="311" font-size="32" fill="#1F2A5C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >兒童新樂園 3F｜幸福碰碰車</text><rect x="750" y="262" width="400" height="74" rx="37" fill="#fff" stroke="#1F2A5C" stroke-width="3"/><rect x="760" y="272" width="96" height="54" rx="27" fill="#17A99B"/><text x="808" y="309" font-size="26" fill="#fff" font-weight="800" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >人數</text><text x="876" y="311" font-size="32" fill="#1F2A5C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >每隊 6–10 人</text><rect x="1180" y="262" width="660" height="74" rx="37" fill="#fff" stroke="#1F2A5C" stroke-width="3"/><rect x="1190" y="272" width="96" height="54" rx="27" fill="#F5A623"/><text x="1238" y="309" font-size="26" fill="#fff" font-weight="800" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >時間</text><text x="1306" y="311" font-size="32" fill="#1F2A5C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >15 分鐘（搭乘約 3 分鐘）</text><rect x="60" y="372" width="880" height="508" rx="28" fill="#fff" stroke="#1F2A5C" stroke-width="3"/><rect x="100" y="420" width="140" height="16" fill="#FFC93C"/><text x="100" y="428" font-size="40" fill="#1F2A5C" font-weight="900" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >任務流程</text><circle cx="126" cy="490" r="25" fill="#FF6B5B"/><text x="126" y="500" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >1</text><text x="172" y="496" font-size="31" fill="#1F2A5C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >聽關主說明三道題目</text><text x="172" y="526" font-size="22" fill="#5B6275" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >約 3 分鐘，認識三位關主與三種題型</text><circle cx="126" cy="566" r="25" fill="#FF6B5B"/><text x="126" y="576" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >2</text><text x="172" y="572" font-size="31" fill="#1F2A5C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >手機收好，全員上車</text><text x="172" y="602" font-size="22" fill="#5B6275" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >繫好安全帶，開車中禁止拍照、抄寫</text><circle cx="126" cy="642" r="25" fill="#FF6B5B"/><text x="126" y="652" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >3</text><text x="172" y="648" font-size="31" fill="#1F2A5C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >開車 3 分鐘，邊開邊看題目牌</text><text x="172" y="678" font-size="22" fill="#5B6275" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >關主隨機現身場邊舉牌，看到就要記</text><circle cx="126" cy="718" r="25" fill="#FF6B5B"/><text x="126" y="728" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >4</text><text x="172" y="724" font-size="31" fill="#1F2A5C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >下車集合，寫好答案卡</text><text x="172" y="754" font-size="22" fill="#5B6275" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >全隊討論，限時 1 分鐘</text><circle cx="126" cy="794" r="25" fill="#FF6B5B"/><text x="126" y="804" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >5</text><text x="172" y="800" font-size="31" fill="#1F2A5C" font-weight="700" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >對答案，答對 2 題就過關</text><text x="172" y="830" font-size="22" fill="#5B6275" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >三題答對兩題即過關，前往下一關</text><rect x="985" y="420" width="140" height="16" fill="#FFC93C"/><text x="985" y="428" font-size="40" fill="#1F2A5C" font-weight="900" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >三道題目</text><rect x="980" y="458" width="880" height="124" rx="24" fill="#fff" stroke="#1F2A5C" stroke-width="3"/><path d="M980,482 a24,24 0 0 1 24,-24 h40 v124 h-40 a24,24 0 0 1 -24,-24Z" fill="#FF6B5B"/><circle cx="1076" cy="520" r="34" fill="#FF6B5B"/><text x="1076" y="533" font-size="38" fill="#fff" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >A</text><text x="1132" y="514" font-size="34" fill="#1F2A5C" font-weight="800" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >關主 A｜四則運算</text><text x="1132" y="554" font-size="25" fill="#5B6275" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >看懂算式，下車後寫出正確答案</text><rect x="980" y="600" width="880" height="124" rx="24" fill="#fff" stroke="#1F2A5C" stroke-width="3"/><path d="M980,624 a24,24 0 0 1 24,-24 h40 v124 h-40 a24,24 0 0 1 -24,-24Z" fill="#17A99B"/><circle cx="1076" cy="662" r="34" fill="#17A99B"/><text x="1076" y="675" font-size="38" fill="#fff" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >B</text><text x="1132" y="656" font-size="34" fill="#1F2A5C" font-weight="800" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >關主 B｜問答題</text><text x="1132" y="696" font-size="25" fill="#5B6275" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >記住題目，下車後寫出答案</text><rect x="980" y="742" width="880" height="124" rx="24" fill="#fff" stroke="#1F2A5C" stroke-width="3"/><path d="M980,766 a24,24 0 0 1 24,-24 h40 v124 h-40 a24,24 0 0 1 -24,-24Z" fill="#F5A623"/><circle cx="1076" cy="804" r="34" fill="#F5A623"/><text x="1076" y="817" font-size="38" fill="#fff" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >C</text><text x="1132" y="798" font-size="34" fill="#1F2A5C" font-weight="800" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >關主 C｜文字記憶</text><text x="1132" y="838" font-size="25" fill="#5B6275" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >記下牌上 15–20 字內容，一字不差</text><rect x="60" y="904" width="1800" height="150" rx="24" fill="#1F2A5C"/><rect x="92" y="921" width="78" height="36" rx="18" fill="#FFC93C"/><text x="131" y="947" font-size="22" fill="#1F2A5C" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >公平</text><text x="190" y="948" font-size="27" fill="#fff" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >全員上車下場玩遊戲；開車中禁止拍照、抄寫，只能用眼睛記。</text><rect x="92" y="965" width="78" height="36" rx="18" fill="#FF6B5B"/><text x="131" y="991" font-size="22" fill="#1F2A5C" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >安全</text><text x="190" y="992" font-size="27" fill="#fff" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >繫好安全帶、不可站立、不惡意高速正面衝撞，一律聽從園方工作人員指示。</text><rect x="92" y="1009" width="78" height="36" rx="18" fill="#17A99B"/><text x="131" y="1035" font-size="22" fill="#1F2A5C" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >道具</text><text x="190" y="1036" font-size="27" fill="#fff" font-weight="500" text-anchor="start" font-family="'Noto Sans TC',sans-serif" >題目牌 3 張（A3 以上）、答案卡、筆、夾板、碼表、哨子</text><rect x="1560" y="388" width="300" height="56" rx="28" fill="#FFC93C" stroke="#1F2A5C" stroke-width="3"/><text x="1710" y="426" font-size="28" fill="#1F2A5C" font-weight="900" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" >答對 2 題即過關</text></svg>